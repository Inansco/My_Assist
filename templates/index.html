<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inansco AI Assistant</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            margin: 5px 0 0;
            color: #d1d5db;
        }

        #chat {
            height: 450px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 10px;
            max-width: 75%;
        }

        .user {
            background: #dbeafe;
            margin-left: auto;
        }

        .assistant {
            background: #f3f4f6;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        #message {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #374151;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Inansco</h1>
        <p>Your AI Assistant</p>
    </div>

    <div id="chat">

        <div class="message assistant">
            Hello! I'm Inansco. How can I help you?
        </div>

    </div>

    <div class="input-area">

        <input
            id="message"
            type="text"
            placeholder="Talk to Inansco..."
            autocomplete="off"
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script>

async function sendMessage() {

    const input = document.getElementById("message");
    const chat = document.getElementById("chat");

    const message = input.value.trim();

    if (!message) {
        return;
    }

    // Show user message
    const userMessage = document.createElement("div");

    userMessage.className = "message user";
    userMessage.textContent = message;

    chat.appendChild(userMessage);

    input.value = "";

    // Send message to FastAPI
    try {

        const response = await fetch("/api/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });

        const data = await response.json();

        // Show assistant response
        const assistantMessage = document.createElement("div");

        assistantMessage.className = "message assistant";
        assistantMessage.textContent = data.reply;

        chat.appendChild(assistantMessage);

        chat.scrollTop = chat.scrollHeight;

    } catch (error) {

        const errorMessage = document.createElement("div");

        errorMessage.className = "message assistant";
        errorMessage.textContent = "Unable to connect to Inansco.";

        chat.appendChild(errorMessage);

    }
}


// Press Enter to send
document.getElementById("message").addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
